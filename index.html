<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#121417">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="geofinal.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Geography Final — ΠΕΓΠ</title>
<style>
:root{
  --bg:#121417; --panel:#1c1f24; --panel2:#262a31; --line:#343a44;
  --neon:#c6ff00; --neonink:#0b0c0e;
  --card:#f6f5f1; --ink:#1b1d21; --soft:#646a73; --cline:#e0ddd3;
  --live:#c9d1db; --known:#4ade80;
  --l1:#4ade80; --l2:#facc15; --l3:#fb923c; --l4:#f43f5e; --lp:#c084fc;
  --dim:#9aa3ae;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:#eef1f4;
  font-family:"Segoe UI",Roboto,"Noto Sans","Helvetica Neue",Arial,sans-serif}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:640px;margin:0 auto;padding:14px 14px 26px}
button{font-family:inherit;cursor:pointer;color:inherit}

header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 2px 12px}
h1{font-size:19px;margin:0;font-weight:800;letter-spacing:.2px;display:flex;align-items:center;gap:9px}
h1 .badge{background:var(--neon);color:var(--neonink);font-weight:900;border-radius:7px;
  width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;font-size:19px}
h1 em{font-style:normal;color:var(--neon)}
#counter{font-size:13px;color:var(--dim);white-space:nowrap}

/* ---- levels ---- */
.levels{display:flex;flex-direction:column;gap:7px;margin-bottom:12px}
.lv{display:grid;grid-template-columns:1fr 62px 62px 34px;gap:6px;align-items:stretch}
.lv .name{background:var(--panel);border-radius:9px;border-left:5px solid var(--lc);
  padding:8px 9px;display:flex;flex-direction:column;justify-content:center;min-width:0}
.lv .name b{font-size:14px;line-height:1.15}
.lv .name small{font-size:11px;color:var(--dim);margin-top:2px}
.pb{background:var(--panel);border:2px solid transparent;border-radius:9px;padding:6px 2px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.pb .num{font-size:20px;font-weight:800}
.pb .lbl{font-size:9.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--dim);margin-top:4px}
.pb.live .num{color:var(--live)}
.pb.known .num{color:var(--known)}
.pb.on{border-color:var(--neon);background:var(--panel2)}
.pb.on .lbl{color:#fff}
.pb:disabled{opacity:.35}
.rst{background:none;border:1px solid var(--line);border-radius:9px;color:var(--dim);font-size:16px;padding:0}
.lv.fixed{grid-template-columns:1fr}
.fixbtn{background:var(--panel);border:2px solid transparent;border-left:5px solid var(--lc);border-radius:9px;
  padding:9px 11px;display:flex;align-items:baseline;gap:10px;text-align:left}
.fixbtn .num{font-size:20px;font-weight:800;color:var(--lc)}
.fixbtn b{font-size:14px}
.fixbtn small{margin-left:auto;font-size:11px;color:var(--dim)}
.fixbtn.on{border-color:var(--neon);border-left-color:var(--lc);background:var(--panel2)}
.studying{font-size:12px;color:var(--dim);text-align:center;margin:0 0 10px}
.studying b{color:#fff}

/* ---- card ---- */
.card{background:var(--card);color:var(--ink);border-radius:12px;padding:16px 16px 20px;min-height:300px;
  border-top:6px solid var(--lc,var(--neon))}
.qnum{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--soft);margin-bottom:10px;font-weight:700}
.instr{font-size:13px;line-height:1.5;color:var(--soft);margin-bottom:11px}
.qtext{font-size:19px;font-weight:700;line-height:1.42;margin:0 0 14px;white-space:pre-wrap}
.qimg{display:block;width:100%;max-width:340px;margin:0 auto 14px;border-radius:8px}
.opts{list-style:none;margin:0;padding:0}
.opt{display:flex;gap:10px;align-items:flex-start;padding:11px 8px;border-top:1px solid var(--cline);
  font-size:16px;line-height:1.42;border-radius:7px;cursor:pointer}
.opt .k{font-weight:800;color:var(--soft);min-width:18px}
.opt.correct{background:#d5f0da}.opt.correct .k{color:#1f7a3c}
.opt.wrong{background:#f8d9d5}.opt.wrong .k{color:#b3352a}
.opt.dim{opacity:.55}
.opts.locked .opt{cursor:default}
.body{font-size:16px;line-height:1.55}
.body p{margin:0 0 12px;white-space:pre-wrap}
ol.items,ul.lines{margin:0;padding:0;list-style:none}
ol.items li,ul.lines li{padding:8px 0;border-bottom:1px solid var(--cline)}
ol.items li:last-child,ul.lines li:last-child{border-bottom:0}
table.match{width:100%;border-collapse:collapse;font-size:14.5px;line-height:1.4}
table.match th{background:#e9e5d8;text-align:left;font-size:12px;letter-spacing:.5px;padding:8px}
table.match td{border:1px solid #d9d4c5;padding:8px;vertical-align:top}
.answer{margin-top:16px;padding:13px 13px;background:#e6edf0;border-left:5px solid var(--lc,var(--neon));border-radius:7px}
.answer .al{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--soft);font-weight:800;margin-bottom:6px}
.answer .at{font-size:16.5px;line-height:1.5;white-space:pre-wrap;font-weight:600}
.answer img{width:100%;border-radius:5px;display:block;margin-top:4px}
.verdict{margin-top:14px;font-size:15px;font-weight:800}
.verdict.ok{color:#1f7a3c}.verdict.no{color:#b3352a}
.tap{margin-top:10px;font-size:12.5px;color:var(--soft)}
.empty{text-align:center;color:var(--soft);font-size:16px;padding:56px 18px;line-height:1.6}

/* ---- controls ---- */
.big{display:block;width:100%;margin-top:12px;padding:15px;border:0;border-radius:10px;
  background:var(--neon);color:var(--neonink);font-size:17px;font-weight:800}
.sortrow{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}
.sortrow button{background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:11px 6px;
  font-size:15px;font-weight:800;line-height:1.25}
.sortrow button small{display:block;font-size:11px;font-weight:400;color:var(--dim);margin-top:2px}
.sortrow .s-live{color:var(--live)}.sortrow .s-known{color:var(--known)}
.sortrow button.cur{border-color:currentColor;background:var(--panel2)}
.navrow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin-top:12px}
.navrow button{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:11px 6px;font-size:14px;color:#dfe5ea}
.navrow button:disabled{opacity:.35}
.goto{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:13px;color:var(--dim);flex-wrap:wrap}
.goto input{width:76px;padding:9px 10px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:#eef1f4;font:inherit;font-size:15px;text-align:center}
.goto button{padding:9px 16px;border-radius:9px;border:0;background:var(--neon);color:var(--neonink);font-size:14px;font-weight:800}
#gotoMsg{flex-basis:100%;min-height:16px;font-size:12px;line-height:1.5}
footer{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:16px;font-size:12px;color:var(--dim);flex-wrap:wrap}
footer .acts{display:flex;gap:14px}
footer .acts button{background:none;border:0;color:var(--dim);text-decoration:underline;padding:4px 0;font-size:12px}
#restoreFile{display:none}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span class="badge">Γ</span><span>Geography <em>Final</em></span></h1>
    <div id="counter"></div>
  </header>
  <div class="levels" id="levels"></div>
  <div class="studying" id="studying"></div>
  <div class="card" id="card"></div>
  <div id="controls"></div>
  <div class="navrow">
    <button id="prev">← Back</button>
    <button id="shuffle">Shuffle</button>
    <button id="next">Next →</button>
  </div>
  <div class="goto"><label for="gotoN">Go to question</label><input id="gotoN" type="number" inputmode="numeric" placeholder="no."><button id="gotoBtn" type="button">Go</button><span id="gotoMsg"></span></div>
  <footer>
    <span id="foot"></span>
    <span class="acts">
      <button id="backup">Backup</button>
      <button id="restore">Restore</button>
      <button id="resetAll">Reset all</button>
    </span>
    <input type="file" id="restoreFile" accept="application/json,.json">
  </footer>
</div>
<script>
var APP = {"id": "geofinal", "key": "pegp-geofinal-v1"};
var TIERS = [{"id": "a", "name": "Refresh", "sub": "regular re-practice", "lvl": "l1", "ns": [15, 17, 21, 22, 24, 25, 27, 29, 35, 36, 37, 43], "fixed": false}, {"id": "b", "name": "Freshen up", "sub": "more active", "lvl": "l2", "ns": [6, 14, 19], "fixed": false}, {"id": "c", "name": "Intensive", "sub": "really tricky", "lvl": "l4", "ns": [31, 39, 40, 41, 42], "fixed": false}, {"id": "d", "name": "Maps · frequent", "sub": "refresh often", "lvl": "l2", "ns": [65, 67], "fixed": false}, {"id": "e", "name": "Maps · active", "sub": "active work", "lvl": "l3", "ns": [53, 55, 57], "fixed": false}];
var ITEMS = [{"n": 6, "label": "Question 6", "body": "<div class=\"instr\">Γράψτε στο τετράδιό σας τον αριθμό του θέματος και τέσσερις (4) από τις (13) Διοικητικές Περιφέρειες της Ελλάδας.<\/div>", "k": "rev", "ans": "Η Ελλάδα αποτελείται συνολικά από 13 Διοικητικές Περιφέρειες: Ανατολικής Μακεδονίας και Θράκης, Αττικής, Βορείου Αιγαίου, Δυτικής Ελλάδας, Δυτικής Μακεδονίας, Ηπείρου, Θεσσαλίας, Ιονίων Νήσων, Κεντρικής Μακεδονίας, Κρήτης, Νοτίου Αιγαίου, Πελοποννήσου, Στερεάς Ελλάδας."}, {"n": 14, "label": "Question 14", "body": "<div class=\"instr\">Γράψτε στο τετράδιό σας τον αριθμό του θέματος και τέσσερις (4) λίμνες της Ελλάδας που βρίσκονται στη Μακεδονία.<\/div>", "k": "rev", "ans": "Ενδεικτικά, αναφέρονται: Μικρή Πρέσπα, Μεγάλη Πρέσπα, Βόλβη, Βεγορίτιδα, Δοϊράνη, Ορεστιάδα, Κορώνεια, Κερκίνη."}, {"n": 15, "label": "Question 15", "body": "<div class=\"instr\">Γράψτε στο τετράδιό σας τον αριθμό του θέματος και τον αριθμό που αντιστοιχεί σε κάθε κενό, σημειώνοντας δίπλα τη λέξη ή τη φράση που ταιριάζει, επιλέγοντας από τις παρακάτω: <i>της Θράκης, της Μακεδονίας, της Ηπείρου, της Πελοποννήσου, των νησιών Αιγαίου πελάγους<\/i> (<u>μια απάντηση περισσεύει<\/u>):<\/div><div class=\"qtext\">Α. Η Αχαΐα ανήκει στο γεωγραφικό διαμέρισμα (1) ________________\nΒ. Τα Ιωάννινα ανήκουν στο γεωγραφικό διαμέρισμα (2) ________________\nΓ. Η Καβάλα ανήκει στο γεωγραφικό διαμέρισμα (3) ________________\nΔ. Η Σάμος ανήκει στο γεωγραφικό διαμέρισμα (4) ________________<\/div>", "k": "rev", "ans": "(1) της Πελοποννήσου, (2) της Ηπείρου, (3) της Μακεδονίας, (4) των νησιών Αιγαίου πελάγους"}, {"n": 17, "label": "Question 17", "body": "<div class=\"instr\">Γράψτε στο τετράδιό σας τον αριθμό του θέματος και τον αριθμό που αντιστοιχεί σε κάθε κενό, σημειώνοντας δίπλα τη λέξη ή τη φράση που ταιριάζει, επιλέγοντας από τις παρακάτω: <i>την Αλεξανδρούπολη, τη Βέροια, την Έδεσσα, την Κομοτηνή<\/i><\/div><div class=\"qtext\">Α. Η Περιφερειακή Ενότητα Έβρου έχει πρωτεύουσα την (1) ________________\nΒ. Η Περιφερειακή Ενότητα Ροδόπης έχει πρωτεύουσα την (2) ________________\nΓ. Η Περιφερειακή Ενότητα Πέλλας έχει πρωτεύουσα την (3) ________________\nΔ. Η Περιφερειακή Ενότητα Ημαθίας έχει πρωτεύουσα την (4) ________________<\/div>", "k": "rev", "ans": "(1) την Αλεξανδρούπολη, (2) την Κομοτηνή, (3) την Έδεσσα, (4) τη Βέροια"}, {"n": 19, "label": "Question 19", "body": "<div class=\"instr\">Γράψτε στο τετράδιό σας τον αριθμό του θέματος και τον αριθμό που αντιστοιχεί σε κάθε κενό, σημειώνοντας δίπλα τη λέξη ή τη φράση που ταιριάζει, επιλέγοντας από τις παρακάτω: <i>Αχαΐας, Κορινθίας, Πρέβεζας, Αιτωλοακαρνανίας<\/i><\/div><div class=\"qtext\">Α. Το Λουτράκι βρίσκεται στην Περιφερειακή Ενότητα (1) ________________\nΒ. Το Αίγιο βρίσκεται στην Περιφερειακή Ενότητα (2) ________________\nΓ. Το Αγρίνιο βρίσκεται στην Περιφερειακή Ενότητα (3) ________________\nΔ. Η Πάργα βρίσκεται στην Περιφερειακή Ενότητα (4) ________________<\/div>", "k": "rev", "ans": "(1) Κορινθίας, (2) Αχαΐας, (3) Αιτωλοακαρνανίας, (4) Πρέβεζας"}, {"n": 21, "label": "Question 21", "body": "<div class=\"instr\">Γράψτε στο τετράδιό σας τον αριθμό του θέματος και τέσσερα (4) από τα βουνά της Ελλάδας.<\/div>", "k": "rev", "ans": "Στη συνέχεια αναφέρονται κάποια από τα βουνά της Ελλάδας: Όλυμπος, Βόρας, Γράμμος, Παγγαίο, Χελμός, Σμόλικας, Παρνασσός, Ταΰγετος, Ψηλορείτης (Ίδη), Γκιώνα"}, {"n": 22, "label": "Question 22", "body": "<div class=\"instr\">Γράψτε στο τετράδιό σας τα τέσσερα άκρα σημεία της Ελλάδας.<\/div>", "k": "rev", "ans": "(1) Οθωνοί (Φανοί), (2) Ορμένιο, (3) Καστελλόριζο (Μεγίστη), (4) Γαύδος"}, {"n": 24, "label": "Question 24", "body": "<div class=\"instr\">Γράψτε στο τετράδιό σας τον αριθμό του θέματος και τις τέσσερις Περιφερειακές Ενότητες της Κρήτης.<\/div>", "k": "rev", "ans": "Παρακάτω σημειώνονται οι Περιφερειακές Ενότητες της Κρήτης: Ηρακλείου, Λασιθίου, Ρεθύμνου, Χανίων"}, {"n": 25, "label": "Question 25", "body": "<div class=\"instr\">Γράψτε στο τετράδιό σας τον αριθμό του θέματος και τις τέσσερις Περιφερειακές Ενότητες της Ηπείρου.<\/div>", "k": "rev", "ans": "Παρακάτω σημειώνονται οι τέσσερις Περιφερειακές Ενότητες της Ηπείρου: Ιωαννίνων, Θεσπρωτίας, Άρτας, Πρέβεζας"}, {"n": 27, "label": "Question 27", "body": "<div class=\"instr\">Γράψτε στο τετράδιό σας τον αριθμό του θέματος και τον αριθμό που αντιστοιχεί σε κάθε κενό, σημειώνοντας δίπλα τη λέξη ή τη φράση που ταιριάζει, επιλέγοντας από τις παρακάτω: <i>την Τουρκία (2 φορές), τη Δημοκρατία της Βόρειας Μακεδονίας, τη Βουλγαρία<\/i><\/div><div class=\"qtext\">Α. Η Κως συνορεύει με (1) _____________________\nΒ. Το Διδυμότειχο συνορεύει με (2) ________________\nΓ. Η Εξοχή Δράμας συνορεύει με (3) __________________\nΔ. Η Νίκη Φλώρινας συνορεύει με (4) ___________________<\/div>", "k": "rev", "ans": "(1) την Τουρκία, (2) την Τουρκία, (3) τη Βουλγαρία, (4) τη Δημοκρατία της Βόρειας Μακεδονίας"}, {"n": 29, "label": "Question 29", "body": "<div class=\"instr\">Γράψτε στο τετράδιό σας τον αριθμό του θέματος και τον αριθμό της κάθε πρότασης, σημειώνοντας Σ, αν η πρόταση που σας δίνεται παρακάτω είναι σωστή, ή Λ, αν είναι λάθος.<\/div><div class=\"qtext\">1. Ο πορθμός του Ευρίπου βρίσκεται στη Χαλκίδα\n2. Η Περιφερειακή Ενότητα Ροδόπης έχει πρωτεύουσα την Κομοτηνή\n3. Η Περιφερειακή Ενότητα Βοιωτίας έχει πρωτεύουσα τη Θήβα\n4. Το κλίμα της Ελλάδας είναι εύκρατο μεσογειακό<\/div>", "k": "rev", "ans": "(1) Σ, (2) Σ, (3) Λ, (4) Σ"}, {"n": 31, "label": "Question 31", "body": "<div class=\"instr\">Γράψτε στο τετράδιό σας τον αριθμό του θέματος και τον αριθμό της κάθε πρότασης, σημειώνοντας Σ, αν η πρόταση που σας δίνεται παρακάτω είναι σωστή, ή Λ, αν είναι λάθος.<\/div><div class=\"qtext\">1. Η Περιφερειακή Ενότητα Σποράδων ανήκει στην Περιφέρεια Κεντρικής Μακεδονίας\n2. Η Σκύρος ανήκει διοικητικά στην Περιφέρεια Στερεάς Ελλάδας\n3. Στο Θαλάσσιο Πάρκο Αλοννήσου βρίσκεται το καταφύγιο της μεσογειακής φώκιας (monachus monachus)\n4. Στη Σκύρο ζει μία από τις πιο σπάνιες φυλές αλόγων στον κόσμο<\/div>", "k": "rev", "ans": "(1) Λ, (2) Σ, (3) Σ, (4) Σ"}, {"n": 35, "label": "Question 35", "body": "<div class=\"instr\">Γράψτε στο τετράδιό σας τον αριθμό του θέματος και τον αριθμό της κάθε πρότασης, σημειώνοντας Σ, αν η πρόταση που σας δίνεται παρακάτω είναι σωστή, ή Λ, αν είναι λάθος.<\/div><div class=\"qtext\">1. Η Σκόπελος ανήκει στις Κυκλάδες\n2. Η Αμοργός ανήκει στα Ιόνια νησιά\n3. Η Αστυπάλαια ανήκει στα Δωδεκάνησα\n4. Η Λήμνος ανήκει στα νησιά του Βορείου Αιγαίου<\/div>", "k": "rev", "ans": "(1) Λ, (2) Λ, (3) Σ, (4) Σ"}, {"n": 36, "label": "Question 36", "body": "<div class=\"instr\">Γράψτε στο τετράδιό σας τον αριθμό του θέματος και τον αριθμό της κάθε πρότασης, σημειώνοντας Σ, αν η πρόταση που σας δίνεται παρακάτω είναι σωστή, ή Λ, αν είναι λάθος.<\/div><div class=\"qtext\">1. Ο ποταμός Αλιάκμονας εκβάλλει στον Θερμαϊκό Κόλπο\n2. Ο ποταμός Αχελώος εκβάλλει στο Ιόνιο Πέλαγος\n3. Ο ποταμός Πηνειός (της Θεσσαλίας) εκβάλλει στον Θερμαϊκό Κόλπο\n4. Ο ποταμός Αξιός εκβάλλει στο Ιόνιο Πέλαγος<\/div>", "k": "rev", "ans": "(1) Σ, (2) Σ, (3) Σ, (4) Λ"}, {"n": 37, "label": "Question 37", "body": "<div class=\"instr\">Γράψτε στο τετράδιό σας τον αριθμό του θέματος και τον αριθμό της κάθε πρότασης, σημειώνοντας Σ, αν η πρόταση που σας δίνεται παρακάτω είναι σωστή, ή Λ, αν είναι λάθος.<\/div><div class=\"qtext\">1. Η Κάσος βρίσκεται στο Αιγαίο Πέλαγος\n2. Η Αστυπάλαια βρίσκεται στο Αιγαίο Πέλαγος\n3. Η Ιθάκη βρίσκεται στο Ιόνιο Πέλαγος\n4. Οι Παξοί βρίσκονται στο Ιόνιο Πέλαγος<\/div>", "k": "rev", "ans": "(1) Σ, (2) Σ, (3) Σ, (4) Σ"}, {"n": 39, "label": "Question 39", "body": "<div class=\"instr\">Γράψτε στο τετράδιό σας τον αριθμό του θέματος και τον αριθμό της κάθε πρότασης, σημειώνοντας Σ, αν η πρόταση που σας δίνεται παρακάτω είναι σωστή, ή Λ, αν είναι λάθος.<\/div><div class=\"qtext\">1. Η Ναύπακτος βρίσκεται στην Περιφερειακή Ενότητα Αιτωλοακαρνανίας\n2. Το Γαλαξίδι βρίσκεται στην Περιφερειακή Ενότητα Φωκίδας\n3. Η Αταλάντη βρίσκεται στην Περιφερειακή Ενότητα Φθιώτιδας\n4. Η Αμφιλοχία βρίσκεται στην Περιφερειακή Ενότητα Άρτας<\/div>", "k": "rev", "ans": "(1) Σ, (2) Σ, (3) Σ, (4) Λ"}, {"n": 40, "label": "Question 40", "body": "<div class=\"instr\">Γράψτε στο τετράδιό σας τον αριθμό του θέματος και τον αριθμό της κάθε πρότασης, σημειώνοντας Σ, αν η πρόταση που σας δίνεται παρακάτω είναι σωστή, ή Λ, αν είναι λάθος.<\/div><div class=\"qtext\">1. Η Τρίπολη είναι πρωτεύουσα της Περιφερειακής Ενότητας Αρκαδίας\n2. Το Άργος είναι πρωτεύουσα της Περιφερειακής Ενότητας Αργολίδας\n3. Το Γύθειο είναι πρωτεύουσα της Περιφερειακής Ενότητας Λακωνίας\n4. Τα Καλάβρυτα βρίσκονται στην Περιφερειακή Ενότητα Αχαΐας<\/div>", "k": "rev", "ans": "(1) Σ, (2) Λ, (3) Λ, (4) Σ"}, {"n": 41, "label": "Question 41", "body": "<div class=\"instr\">Γράψτε στο τετράδιό σας τον αριθμό του θέματος και τον αριθμό της κάθε πρότασης, σημειώνοντας Σ, αν η πρόταση που σας δίνεται παρακάτω είναι σωστή, ή Λ, αν είναι λάθος.<\/div><div class=\"qtext\">1. Η Θάσος βρίσκεται στην Περιφερειακή Ενότητα Καβάλας\n2. Το Αμύνταιο βρίσκεται στην Περιφερειακή Ενότητα Φλώρινας\n3. Το Μέτσοβο βρίσκεται στην Περιφερειακή Ενότητα Θεσπρωτίας\n4. Η Αράχοβα βρίσκεται στην Περιφερειακή Ενότητα Φωκίδας<\/div>", "k": "rev", "ans": "(1) Λ, (2) Σ, (3) Λ, (4) Λ"}, {"n": 42, "label": "Question 42", "body": "<div class=\"instr\">Γράψτε στο τετράδιό σας τον αριθμό του θέματος και τον αριθμό της κάθε πρότασης, σημειώνοντας Σ, αν η πρόταση που σας δίνεται παρακάτω είναι σωστή, ή Λ, αν είναι λάθος.<\/div><div class=\"qtext\">1. Το Γύθειο βρίσκεται στην Περιφερειακή Ενότητα Μεσσηνίας\n2. Η Βόνιτσα βρίσκεται στην Περιφερειακή Ενότητα Πρέβεζας\n3. Η Νιγρίτα βρίσκεται στην Περιφερειακή Ενότητα Δράμας\n4. Η Ορεστιάδα βρίσκεται στην Περιφερειακή Ενότητα Έβρου<\/div>", "k": "rev", "ans": "(1) Λ, (2) Λ, (3) Λ, (4) Σ"}, {"n": 43, "label": "Question 43", "body": "<div class=\"instr\">Γράψτε στο τετράδιό σας τον αριθμό του θέματος και τον αριθμό της κάθε πρότασης, σημειώνοντας Σ, αν η πρόταση που σας δίνεται παρακάτω είναι σωστή, ή Λ, αν είναι λάθος.<\/div><div class=\"qtext\">1. Στην Ελλάδα υπάρχουν εγκαταστάσεις παραγωγής ηλεκτρικής ενέργειας από λιγνίτη στην Πτολεμαΐδα.\n2. Στο υπέδαφος της Μεγαλόπολης και του Αλιβερίου υπάρχουν κοιτάσματα λιγνίτη.\n3. Το μεγαλύτερο μέρος της ηλεκτρικής ενέργειας που καταναλώνουμε παράγεται από τα κοιτάσματα λιγνίτη.\n4. Οι μεγαλύτερες βιομηχανικές μονάδες της Ελλάδας βρίσκονται στην Πελοπόννησο.<\/div>", "k": "rev", "ans": "(1) Σ, (2) Σ, (3) Λ, (4) Λ"}, {"n": 53, "label": "Question 53", "body": "<div class=\"instr\">Βρείτε και σημειώστε με (●) στον χάρτη του τετραδίου σας τις παρακάτω λιμνοθάλασσες, γράφοντας δίπλα ολογράφως και την αντίστοιχη ονομασία τους:<\/div><div class=\"qtext\">(1) Μεσολογγίου\n(2) Βιστωνίδας-Πόρτο Λάγος\n(3) Λευκάδας\n(4) Αγίου Νικολάου Κρήτης<\/div>", "k": "rev", "ans": "", "aimg": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHCAkIBgoJCAkMCwoMDxoRDw4ODx8WGBMaJSEnJiQhJCMpLjsyKSw4LCMkM0Y0OD0/QkNCKDFITUhATTtBQj//2wBDAQsMDA8NDx4RER4/KiQqPz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz8/Pz//wAARCAKjAmwDASIAAhEBAxEB/8QAGwABAAMBAQEBAAAAAAAAAAAAAAQFBgMBAgf/xABPEAABBAIABAMDCAcGAwYFAwUBAAIDBAURBhIhMRNBURRSYSIycYGRkqGxFSM1QlNUcgcWNHOCwSQzYkNVVpOy0USUs+HwFzZGJSZjZPH/xAAaAQEAAwEBAQAAAAAAAAAAAAAAAQIDBAUG/8QANBEAAgICAQMDAwMCBgEFAAAAAAECEQMSIQQxMhNBURQiYQVxoYHwBhYjQpHRMxVSweHx/9oADAMBAAIRAxEAPwD9anmkbM5rXaA+C5+0S+/+ASz/AIh31fkua2SVGTbs6e0S+/8AgE9ol9/8AuaJSItnT2iX3/wCe0S+/wDgFzUaneqXhKadiOcQyGOTkO+Vw7g/FKQtk32iX3/wCe0S+/8AgFzRKQtnT2iX3/wCe0S+/wDgFzRKQtnT2iX3/wAAntEvv/gFzRKQtnT2iX3/AMAntEvv/gFzRKQtnT2iX3/wCe0S+/8AgFzRKQtnT2iX3/wCe0S+/wDgFzRKQtnT2iX3/wAAntEvv/gFzRKQtnT2iX3/AMAntEvv/gFzRKQtnT2iX3/wCe0S+/8AgFzRKQtnT2iX3/wCe0S+/wDgFzRKQtnT2iX3/wAAntEvv/gFzRKQtnT2iX3/AMAntEvv/gFzRKQtnT2iX3/wCe0S+/8AgFzRKQtnT2iX3/wCe0S+/wDgFzRKQtnT2iX3/wAAntEvv/gFzRKQtnT2iX3/AMAntEvv/gFzRKQtnT2iX3/wCe0S+/8AgFzRKQtnT2iX3/wCe0S+/wDgFzRKQtnT2iX3/wAAntEvv/gFzRKQtnT2iX3/AMAntEvv/gFzRKQtnT2iX3/wCe0S+/8AgFzRKQtnT2iX3/wCe0S+/wDgFzRK <script>
(function(){
var KEY = APP.key;
var BY = {}; ITEMS.forEach(function(it){ BY[it.n] = it; });
var FILING = TIERS.filter(function(t){ return !t.fixed; });
var TIER_OF = {}; FILING.forEach(function(t){ t.ns.forEach(function(n){ TIER_OF[n] = t.id; }); });
var TB = {}; TIERS.forEach(function(t){ TB[t.id] = t; });

var S = {st:{}, ord:{}, sel:null, at:{}};
var cur = null, revealed = false, picked = null;
var $ = function(id){ return document.getElementById(id); };

function load(){
  try{ var raw = localStorage.getItem(KEY); if(raw){ var d = JSON.parse(raw); if(d && typeof d === 'object') S = d; } }catch(e){}
  if(!S.st) S.st = {}; if(!S.ord) S.ord = {}; if(!S.at) S.at = {};
  FILING.forEach(function(t){ t.ns.forEach(function(n){ if(S.st[n] !== 'live' && S.st[n] !== 'known') S.st[n] = 'live'; }); });
  TIERS.forEach(function(t){
    var o = S.ord[t.id];
    var ok = Array.isArray(o) && o.length === t.ns.length && t.ns.every(function(n){ return o.indexOf(n) > -1; });
    if(!ok) S.ord[t.id] = t.ns.slice();
  });
  if(!S.sel || !TB[S.sel.t]) S.sel = {t:TIERS[0].id, p:TIERS[0].fixed ? 'fix' : 'live'};
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function pk(){ return S.sel.t + ':' + S.sel.p; }
function matches(n){ return TB[S.sel.t].fixed || S.st[n] === S.sel.p; }
function list(){ return S.ord[S.sel.t].filter(matches); }
function count(t, p){ return t.ns.filter(function(n){ return S.st[n] === p; }).length; }
function esc(s){ return String(s).replace(/[&<>]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]; }); }

function openSel(t, p, n){
  S.sel = {t:t, p:p};
  var l = list();
  if(n != null && S.ord[t].indexOf(n) > -1) cur = n;
  else { var a = S.at[pk()]; cur = (a != null && l.indexOf(a) > -1) ? a : (l.length ? l[0] : null); }
  revealed = false; picked = null;
  if(cur != null) S.at[pk()] = cur;
  save(); render(); window.scrollTo(0,0);
}
function step(d){
  var o = S.ord[S.sel.t], L = o.length;
  if(!L) return;
  var i = cur == null ? (d > 0 ? -1 : 0) : o.indexOf(cur), found = null;
  for(var k = 1; k <= L; k++){ var n = o[((i + d*k) % L + L) % L]; if(matches(n)){ found = n; break; } }
  cur = found; revealed = false; picked = null;
  if(cur != null) S.at[pk()] = cur;
  save(); render(); window.scrollTo(0,0);
}
function shuffle(){
  var o = S.ord[S.sel.t];
  for(var i = o.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)); var x = o[i]; o[i] = o[j]; o[j] = x; }
  var l = list(); cur = l.length ? l[0] : null; revealed = false; picked = null;
  if(cur != null) S.at[pk()] = cur;
  save(); render(); window.scrollTo(0,0);
}
function file(p){
  if(cur == null || TB[S.sel.t].fixed) return;
  S.st[cur] = p; save(); render(true);
}
function pick(k){
  if(picked !== null || cur == null) return;
  var it = BY[cur]; picked = k; revealed = true;
  if(!TB[S.sel.t].fixed){ picked_prev = S.st[cur]; S.st[cur] = (k === it.c) ? 'known' : 'live'; save(); }
  render(true);
}
var picked_prev = null;
function resetTier(id){
  var t = TB[id];
  if(!confirm('Put all ' + t.ns.length + ' questions of “' + t.name + '” back into Live?')) return;
  t.ns.forEach(function(n){ S.st[n] = 'live'; });
  delete S.at[id + ':known'];
  openSel(id, 'live');
}

function renderLevels(){
  var h = '';
  TIERS.forEach(function(t){
    var lc = 'var(--' + t.lvl + ')';
    if(t.fixed){
      var on = S.sel.t === t.id;
      h += '<div class="lv fixed" style="--lc:' + lc + '"><button class="fixbtn' + (on ? ' on' : '') + '" data-t="' + t.id + '" data-p="fix">' +
           '<span class="num">' + t.ns.length + '</span><b>' + esc(t.name) + '</b><small>' + esc(t.sub) + '</small></button></div>';
      return;
    }
    var nl = count(t, 'live'), nk = count(t, 'known');
    h += '<div class="lv" style="--lc:' + lc + '">' +
      '<div class="name"><b>' + esc(t.name) + '</b><small>' + t.ns.length + ' question' + (t.ns.length === 1 ? '' : 's') + (t.sub ? ' · ' + esc(t.sub) : '') + '</small></div>' +
      '<button class="pb live' + (S.sel.t === t.id && S.sel.p === 'live' ? ' on' : '') + '" data-t="' + t.id + '" data-p="live"><span class="num">' + nl + '</span><span class="lbl">Live</span></button>' +
      '<button class="pb known' + (S.sel.t === t.id && S.sel.p === 'known' ? ' on' : '') + '" data-t="' + t.id + '" data-p="known"><span class="num">' + nk + '</span><span class="lbl">Known</span></button>' +
      '<button class="rst" data-r="' + t.id + '" title="All back to Live" aria-label="Put all of this level back into Live">↺</button>' +
      '</div>';
  });
  $('levels').innerHTML = h;
}

function cardHTML(it){
  var h = '<div class="qnum">' + it.label + '</div>' + it.body;
  if(it.k === 'mcq'){
    var done = picked !== null;
    h += '<ul class="opts' + (done ? ' locked' : '') + '">';
    it.opts.forEach(function(o){
      var cls = 'opt';
      if(done){ if(o[0] === it.c) cls += ' correct'; else if(o[0] === picked) cls += ' wrong'; else cls += ' dim'; }
      h += '<li class="' + cls + '" data-k="' + o[0] + '"><span class="k">' + o[0] + '.</span><span>' + o[1] + '</span></li>';
    });
    h += '</ul>';
    if(done){
      var ok = picked === it.c, fixed = TB[S.sel.t].fixed, msg;
      if(fixed) msg = ok ? '✓ Correct' : '✗ Wrong — the answer is ' + it.c;
      else if(ok) msg = '✓ Correct — ' + (picked_prev === 'known' ? 'stays in Known' : 'moved to Known');
      else msg = '✗ Wrong — the answer is ' + it.c + (picked_prev === 'known' ? ' · moved back to Live' : ' · stays in Live');
      h += '<div class="verdict ' + (ok ? 'ok' : 'no') + '">' + msg + '</div>';
    } else h += '<div class="tap">Tap the answer you think is correct</div>';
  } else if(revealed){
    h += '<div class="answer"><div class="al">Απάντηση</div>';
    if(it.ans) h += '<div class="at">' + it.ans + '</div>';
    if(it.aimg) h += '<img alt="" src="' + it.aimg + '">';
    h += '</div>';
  }
  return h;
}

function render(stay){
  renderLevels();
  var t = TB[S.sel.t], l = list();
  var card = $('card'), ctr = $('controls');
  card.style.setProperty('--lc', 'var(--' + t.lvl + ')');
  $('studying').innerHTML = 'Studying <b>' + esc(t.name) + (t.fixed ? '' : ' · ' + (S.sel.p === 'live' ? 'Live' : 'Known')) + '</b>';
  $('prev').disabled = $('next').disabled = $('shuffle').disabled = !l.length;
  if(cur == null || S.ord[t.id].indexOf(cur) < 0){
    $('counter').textContent = '0 / 0';
    card.innerHTML = '<div class="empty">' + (S.sel.p === 'known'
      ? 'Nothing in Known here yet.'
      : 'Live is empty — everything in this level is Known.<br>Tap <b>↺</b> to put it all back into Live.') + '</div>';
    ctr.innerHTML = '';
    return;
  }
  var it = BY[cur], pos = l.indexOf(cur);
  $('counter').textContent = (pos > -1 ? (pos + 1) : '–') + ' / ' + l.length;
  card.innerHTML = cardHTML(it);

  var c = '';
  if(it.k !== 'mcq' && !revealed) c += '<button class="big" id="show">Show answer</button>';
  var answered = it.k === 'mcq' ? picked !== null : revealed;
  if(answered && !t.fixed){
    var s = S.st[cur];
    c += '<div class="sortrow">' +
      '<button class="s-live' + (s === 'live' ? ' cur' : '') + '" data-f="live">Live<small>see again</small></button>' +
      '<button class="s-known' + (s === 'known' ? ' cur' : '') + '" data-f="known">Known<small>I know it</small></button></div>';
  }
  ctr.innerHTML = c;
}

$('levels').addEventListener('click', function(e){
  var r = e.target.closest('[data-r]'); if(r){ resetTier(r.dataset.r); return; }
  var b = e.target.closest('[data-t]'); if(!b) return;
  openSel(b.dataset.t, b.dataset.p);
});
$('card').addEventListener('click', function(e){
  var li = e.target.closest('.opt[data-k]'); if(li) pick(li.dataset.k);
});
$('controls').addEventListener('click', function(e){
  if(e.target.closest('#show')){ revealed = true; render(true); return; }
  var f = e.target.closest('[data-f]'); if(f) file(f.dataset.f);
});
$('next').addEventListener('click', function(){ step(1); });
$('prev').addEventListener('click', function(){ step(-1); });
$('shuffle').addEventListener('click', shuffle);

/* go to question */
(function(){
  var inp = $('gotoN'), msg = $('gotoMsg');
  var all = ITEMS.map(function(i){ return i.n; }).sort(function(a,b){ return a-b; });
  function go(){
    var v = parseInt(inp.value, 10);
    if(!BY[v]){ msg.textContent = 'In this app: ' + all.join(', '); return; }
    var tid = TIER_OF[v], extra = '';
    if(tid == null){ tid = TIERS.filter(function(t){ return t.ns.indexOf(v) > -1; })[0].id; openSel(tid, 'fix', v); }
    else openSel(tid, S.st[v], v);
    var also = TIERS.filter(function(t){ return t.fixed && t.id !== tid && t.ns.indexOf(v) > -1; });
    if(also.length) extra = ' (also in ' + also.map(function(t){ return t.name; }).join(', ') + ')';
    var t = TB[tid];
    msg.textContent = 'Question ' + v + ' — in ' + t.name + (t.fixed ? '' : ' · ' + (S.st[v] === 'live' ? 'Live' : 'Known')) + extra;
    inp.value = ''; inp.blur();
  }
  $('gotoBtn').addEventListener('click', go);
  inp.addEventListener('keydown', function(e){ e.stopPropagation(); if(e.key === 'Enter'){ e.preventDefault(); go(); } });
  inp.addEventListener('input', function(){ msg.textContent = ''; });
})();

/* backup / restore / reset */
$('backup').addEventListener('click', function(){
  var txt = JSON.stringify({app:APP.id, saved:new Date().toISOString(), state:S});
  var d = new Date(), p = function(n){ return String(n).padStart(2,'0'); };
  var name = APP.id + '-backup-' + d.getFullYear() + p(d.getMonth()+1) + p(d.getDate()) + '-' + p(d.getHours()) + p(d.getMinutes()) + '.json';
  try{
    var url = URL.createObjectURL(new Blob([txt], {type:'application/json'}));
    var a = document.createElement('a'); a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
  }catch(e){ prompt('Copy this backup text and keep it somewhere safe:', txt); }
});
$('restore').addEventListener('click', function(){ $('restoreFile').click(); });
$('restoreFile').addEventListener('change', function(ev){
  var f = ev.target.files && ev.target.files[0]; ev.target.value = '';
  if(!f) return;
  var r = new FileReader();
  r.onload = function(){
    try{
      var d = JSON.parse(r.result);
      if(!d || d.app !== APP.id || !d.state || !d.state.st) throw 0;
      var k = 0; FILING.forEach(function(t){ t.ns.forEach(function(n){ if(d.state.st[n] === 'known') k++; }); });
      if(!confirm('Restore this backup? ' + k + ' question(s) in Known. Your current progress will be replaced.')) return;
      S = d.state; save(); load(); openSel(S.sel.t, S.sel.p);
    }catch(e){ alert('That file is not a backup from this app.'); }
  };
  r.readAsText(f);
});
$('resetAll').addEventListener('click', function(){
  if(!confirm('Put every question back into Live in every level?')) return;
  FILING.forEach(function(t){ t.ns.forEach(function(n){ S.st[n] = 'live'; }); });
  S.at = {}; S.ord = {}; save(); load();
  openSel(TIERS[0].id, TIERS[0].fixed ? 'fix' : 'live');
});

$('foot').textContent = ITEMS.length + ' questions · November 2026';
load();
openSel(S.sel.t, S.sel.p);
})();
</script>
